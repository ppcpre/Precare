name: Deploy (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

# deploy ทีละครั้ง ห้ามซ้อน — กัน migration ชนกัน
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  D1_DATABASE_NAME: precare-dev-db

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - id: probe
        run: |
          if [ -f package.json ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ยังไม่มี package.json — ยังไม่มีอะไรให้ deploy"
            exit 0
          fi
          # ยังไม่ได้ตั้ง vitest (T6.x) — ข้าม step test ไปก่อน อย่าให้ pipeline แดงเพราะ script หาย
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "test=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json ยังไม่มี script \"test\" — ข้ามขั้นเทสต์"
          fi

      - uses: actions/setup-node@v7
        if: steps.probe.outputs.app == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - if: steps.probe.outputs.app == 'true'
        run: npm ci

      - name: Lint + typecheck
        if: steps.probe.outputs.app == 'true'
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test
        if: steps.probe.outputs.test == 'true'
        run: npm test -- --run

      - name: Build
        if: steps.probe.outputs.app == 'true'
        run: npx opennextjs-cloudflare build

      # กั้นก่อน deploy — บั๊กอัปโหลดรูปเคยผ่าน lint/typecheck/unit test
      # ครบทุกด่านแล้วขึ้น dev ไปทั้งที่กดใช้จริงไม่ได้เลย
      - name: Install Playwright browser
        if: steps.probe.outputs.app == 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E
        if: steps.probe.outputs.app == 'true'
        run: npx playwright test

      - name: เก็บ report ตอน E2E ล้ม
        if: failure() && steps.probe.outputs.app == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-dev
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # ตรวจ secret ก่อน ไม่งั้น wrangler-action จะพังด้วย error ที่อ่านไม่รู้เรื่อง
      - name: ตรวจ secret ของ Cloudflare
        if: steps.probe.outputs.app == 'true'
        run: |
          MISSING=""
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret:$MISSING — ไปที่ Settings > Secrets and variables > Actions"
            echo "  CLOUDFLARE_API_TOKEN ต้องมีสิทธิ์ Workers Scripts: Edit + D1: Edit + Workers R2 Storage: Edit"
            echo "  CLOUDFLARE_ACCOUNT_ID = 6fd3e33f13978c4a3d21ff1cc2924510"
            exit 1
          fi
          echo "secret ครบ"
      # migration ต้องรันก่อน deploy โค้ดใหม่เสมอ — D1 ไม่มี rollback อัตโนมัติ
      # ยิงลง precare-dev-db เท่านั้น ไม่แตะ D1 ของ production
      - name: Apply D1 migrations (dev)
        if: steps.probe.outputs.app == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ env.D1_DATABASE_NAME }} --remote --env dev

      - name: Deploy
        if: steps.probe.outputs.app == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev

      - name: Smoke check
        if: steps.probe.outputs.app == 'true'
        run: |
          [ -n "${{ vars.DEV_URL }}" ] || { echo "::warning::ยังไม่ได้ตั้ง variable DEV_URL — ข้าม smoke check"; exit 0; }
          for i in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "${{ vars.DEV_URL }}" || echo 000)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::dev ไม่ตอบ 200 หลัง deploy"; exit 1
