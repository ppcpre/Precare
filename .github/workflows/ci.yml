name: CI

on:
  pull_request:
  push:
    # main -> deploy.yml, dev -> deploy-dev.yml (สองตัวนั้นตรวจชุดเดียวกันอยู่แล้ว)
    branches-ignore: [main, dev]

# ยกเลิก run เก่าเมื่อ push ทับ — ประหยัด CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # repo ยังไม่มีโค้ดแอป (อยู่ในเฟสออกแบบ) — ข้าม step ที่ต้องใช้ package.json
      - id: probe
        run: |
          if [ -f package.json ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ยังไม่มี package.json — ข้ามขั้น build/test (repo อยู่ในเฟสออกแบบ)"
            exit 0
          fi
          # ยังไม่ได้ตั้ง vitest (T6.x) — ข้าม step test ไปก่อน อย่าให้ pipeline แดงเพราะ script หาย
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "test=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json ยังไม่มี script \"test\" — ข้ามขั้นเทสต์"
          fi

      - uses: actions/setup-node@v7
        if: steps.probe.outputs.app == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        if: steps.probe.outputs.app == 'true'
        run: npm ci

      - name: Lint
        if: steps.probe.outputs.app == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.probe.outputs.app == 'true'
        run: npx tsc --noEmit

      # รันใน workerd จริง ต่อ binding D1 จริง (@cloudflare/vitest-pool-workers)
      - name: Test
        if: steps.probe.outputs.test == 'true'
        run: npm test -- --run

      - name: Build
        if: steps.probe.outputs.app == 'true'
        run: npx opennextjs-cloudflare build

      # E2E รันกับ worker ที่ build ออกมาจริง ไม่ใช่ `next dev`
      # จับบั๊กชั้น DOM กับชั้น runtime ที่ unit test ใน workerd แตะไม่ถึง
      # (เคยหลุดขึ้น production มาแล้ว — ดู docs/tech-notes.md §3.6)
      - name: Install Playwright browser
        if: steps.probe.outputs.app == 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E
        if: steps.probe.outputs.app == 'true'
        run: npx playwright test

      - name: log ของ wrangler ตอน E2E ล้ม
        if: failure() && steps.probe.outputs.app == 'true'
        run: |
          for f in ~/.config/.wrangler/logs/*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            tail -200 "$f"
          done

      - name: เก็บ report ตอน E2E ล้ม
        if: failure() && steps.probe.outputs.app == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Workers free plan จำกัด worker script ที่ 3 MiB (gzip) — ให้ PR แดงก่อนชน
      #
      # ต้องอ่านจาก `wrangler deploy --dry-run` เท่านั้น
      # อย่าไป gzip .open-next/worker.js ตรงๆ — ไฟล์นั้นเป็นแค่ entry ~2 KB
      # ตัวจริงอยู่ใน .open-next/server-functions/ ที่ wrangler รวมให้ตอน bundle
      - name: Bundle size gate
        if: steps.probe.outputs.app == 'true'
        run: |
          OUT=$(npx wrangler deploy --dry-run 2>&1) || { echo "$OUT"; echo "::error::dry-run ล้มเหลว"; exit 1; }
          echo "$OUT" | grep -i "Total Upload" || { echo "$OUT"; echo "::error::อ่านขนาด bundle ไม่ได้"; exit 1; }

          GZIP_KIB=$(echo "$OUT" | grep -oE 'gzip: [0-9.]+ KiB' | grep -oE '[0-9.]+' | head -1)
          LIMIT_KIB=3072   # 3 MiB — เพดานจริงของ free plan
          WARN_KIB=2560    # 2.5 MiB — เตือนล่วงหน้า

          PCT=$(awk -v a="$GZIP_KIB" -v b="$LIMIT_KIB" 'BEGIN{printf "%.1f", a/b*100}')
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo "gzip **${GZIP_KIB} KiB** / เพดาน ${LIMIT_KIB} KiB — ใช้ไป **${PCT}%**" >> "$GITHUB_STEP_SUMMARY"

          if awk -v a="$GZIP_KIB" -v b="$LIMIT_KIB" 'BEGIN{exit !(a>=b)}'; then
            echo "::error::bundle gzip ${GZIP_KIB} KiB เกินเพดาน 3 MiB — deploy ขึ้น free plan ไม่ได้"
            exit 1
          elif awk -v a="$GZIP_KIB" -v b="$WARN_KIB" 'BEGIN{exit !(a>=b)}'; then
            echo "::warning::bundle gzip ${GZIP_KIB} KiB เกิน 2.5 MiB แล้ว ใกล้ชนเพดาน"
          fi
          echo "bundle gzip: ${GZIP_KIB} KiB (${PCT}% ของเพดาน)"

  preview:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - id: probe
        run: |
          if [ -f package.json ]; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v7
        if: steps.probe.outputs.app == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - if: steps.probe.outputs.app == 'true'
        run: npm ci && npx opennextjs-cloudflare build

      # อัปโหลดเป็น version ใหม่ของ worker `precare-dev` — ผูก D1 ของ dev ไม่แตะ production
      - id: upload
        if: steps.probe.outputs.app == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --env dev

      - name: Comment preview URL
        if: steps.probe.outputs.app == 'true'
        uses: actions/github-script@v9
        env:
          WRANGLER_OUTPUT: ${{ steps.upload.outputs.command-output }}
        with:
          script: |
            const out = process.env.WRANGLER_OUTPUT || '';
            const url = (out.match(/https:\/\/[^\s]*\.workers\.dev/) || [])[0];
            const body = url
              ? `🚀 **Preview พร้อมแล้ว**\n\n${url}\n\n_version นี้ผูกกับ \`precare-dev\` (D1 ของ dev) — merge เข้า \`dev\` ถึงจะขึ้น dev จริง, merge \`dev\` → \`main\` ถึงจะขึ้น production_`
              : `⚠️ อัปโหลด version แล้วแต่หา preview URL ในผลลัพธ์ไม่เจอ — ดูใน log ของ job`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes('Preview พร้อมแล้ว'));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
